name: Monthly report

on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase-3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build report
        run: |
          mkdir -p reports
          python src/build_report.py --month $(date -d "last month" +%Y-%m)

      - uses: actions/upload-artifact@v4
        with:
          name: monthly-report
          path: phase-3/reports/*.xlsx